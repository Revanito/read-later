<!DOCTYPE html>
<html lang="{{ lang() }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>{{ _("Log in") }} - read-later</title>
  <link rel="icon" type="image/png" href="/static/favicon.png?v={{ favicon_version }}">
  <link rel="stylesheet" href="/static/style.css?v={{ css_version }}">
</head>
<body>
  <main class="login-page">
    <div class="login-flags">{% include "_flags.html" %}</div>
    <form action="/login" method="post" class="card login-card">
      <h1>read-later</h1>
      <p class="meta">{{ _("Private. Enter the password to continue.") }}</p>
      {% if error %}<p class="form-error">{{ error }}</p>{% endif %}
      <input type="hidden" name="next" value="{{ next }}">
      <input type="password" name="password" placeholder="{{ _('Password') }}" autocomplete="current-password" required autofocus>
      <button type="submit" class="btn-primary">{{ _("Log in") }}</button>
    </form>
  </main>
</body>
</html>
