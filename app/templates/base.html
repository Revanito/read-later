<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}read-later{% endblock %}</title>
  <link rel="icon" type="image/png" href="/static/favicon.png?v={{ favicon_version }}">
  <link rel="stylesheet" href="/static/style.css?v={{ css_version }}">
</head>
<body>
  <header>
    <h1><a href="/">read-later</a></h1>
    <nav class="tabs">
      <a href="/" class="tab{% if tab == 'save' %} active{% endif %}">Save link</a>
      <a href="/articles" class="tab{% if tab == 'articles' %} active{% endif %}">Articles</a>
      <a href="/books" class="tab{% if tab == 'books' %} active{% endif %}">Books</a>
    </nav>
    <form action="/logout" method="post" class="logout"><button type="submit">Log out</button></form>
  </header>
  {% include "_release_panel.html" %}

  <main class="{% block main_class %}{% endblock %}">
    {% if notice %}<div class="notice">{{ notice }}</div>{% endif %}
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
